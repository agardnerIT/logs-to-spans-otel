description: Config defines the configuration for the logs_to_spans connector.
type: object
properties:
  copy_resource_attributes:
    description: CopyResourceAttributes copies the source logs' resource attributes onto the resource of every emitted trace. When a group contains records from more than one resource, the first record's resource is used. Set to false to emit only service.name.
    type: boolean
  duration_keys:
    description: DurationKeys is the ordered list of attribute names that hold an explicit span duration.
    type: array
    items:
      type: string
  end_span_duration:
    description: EndSpanDuration is the duration given to the last span in a group when neither an explicit duration nor a following log provides an end time.
    x-customType: time.duration
  group_by_attributes:
    description: GroupByAttributes is the ordered list of log attribute names to use as the group key. Attribute matches take precedence over GroupByKeys.
    type: array
    items:
      type: string
  group_by_keys:
    description: GroupByKeys is the ordered list of keys to look for in the log body, as structured map keys or as key=value pairs. At least one of GroupByKeys or GroupByAttributes must be set.
    type: array
    items:
      type: string
  group_by_resource_attributes:
    description: 'GroupByResourceAttributes is the ordered list of resource attribute names that scope the group. Records whose resource differs in any of these attributes form separate groups and therefore separate traces. It is an additional scoping dimension: the extracted group key is still required. With an empty list, resource attributes do not affect grouping.'
    type: array
    items:
      type: string
  max_groups:
    description: MaxGroups bounds the number of buffered groups. When a new group would exceed it, the least recently updated group is flushed early. 0 disables the bound.
    type: integer
  max_logs_per_trace:
    description: MaxLogsPerTrace caps the number of log records in one trace. When a group reaches the cap it is flushed as a trace and a follow-on group starts with a span link back to it. 0 disables the cap.
    type: integer
  max_wait:
    description: MaxWait is the maximum time a group may stay open, measured from its first log record, regardless of later activity.
    x-customType: time.duration
  service_name:
    description: ServiceName overrides the service.name resource attribute of every emitted trace. When empty, the source logs' service.name is preserved and "logs-to-spans" is used when the source has none.
    type: string
  span_id_keys:
    description: SpanIDKeys is the ordered list of attribute names that hold the originating span ID, as a 16-character hex string or 8 raw bytes. It is looked up independently of TraceIDKeys, so a record-level trace ID can be paired with a span ID from an attribute. An empty list disables the attribute lookup.
    type: array
    items:
      type: string
  span_name_template:
    description: 'SpanNameTemplate controls the name of every generated span. It is literal text with three placeholders: {body} (the full log body, the default), {severity} (the log record''s severity text) and {truncated:N:body} (the first N characters of the body). An unknown placeholder is a startup error. A template that renders to an empty string falls back to the full body, so a span name is never empty.'
    type: string
  timeout:
    description: Timeout is the inactivity period after which a group is flushed. Each new log record in a group resets it.
    x-customType: time.duration
  trace_id_keys:
    description: TraceIDKeys is the ordered list of attribute names that hold an originating trace ID, as a 32-character hex string or 16 raw bytes. When a log record carries one, the span generated from it links back to that trace. Record-level trace context (set by a receiver or trace_parser operator) takes precedence over these attributes. An empty list disables the attribute lookup.
    type: array
    items:
      type: string
