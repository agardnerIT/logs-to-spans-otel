receivers:
  filelog:
    include: [input.log]
    start_at: beginning
    operators:
      # Most lines in input.log have no timestamp prefix, so the operator is
      # optional: a line that does not match is kept as-is (send_quiet) instead
      # of being dropped or logging an error. The prefix is matched only so it
      # can be removed from the body, never parsed into the record's Timestamp:
      # input.log's one dated line is days old, so a parsed timestamp would put
      # that span outside Jaeger's default "Last 1 hour" view and sort it ahead
      # of the undated lines in its group. With no Timestamp the connector uses
      # ObservedTimestamp, i.e. when the receiver read the line.
      - type: regex_parser
        regex: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\s+(?P<body>.*)$'
        on_error: send_quiet
      - type: move
        from: attributes.body
        to: body
        on_error: send_quiet

connectors:
  logs_to_spans:
    service_name: my-app
    timeout: 5s
    max_wait: 30s
    group_by_keys:
      - UID
      - userID
      - user_id
      - sess_id
    end_span_duration: 500ms
    span_name_template: "{truncated:120:body}"

exporters:
  debug:
    verbosity: detailed
  otlp/jaeger:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: []
      exporters: [logs_to_spans]
    traces:
      receivers: [logs_to_spans]
      exporters: [debug, otlp/jaeger]
