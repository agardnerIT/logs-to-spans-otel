receivers:
  filelog:
    include: [input.log]
    start_at: beginning
    operators:
      - type: regex_parser
        regex: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+(?P<body>.*)$'
        # Most lines in input.log have no timestamp prefix. send_quiet keeps
        # the entry (body unchanged) without logging an error per line.
        on_error: send_quiet
        timestamp:
          parse_from: attributes.ts
          layout: '%Y-%m-%d %H:%M:%S'

connectors:
  logs_to_spans:
    service_name: my-app
    timeout: 5s
    max_wait: 30s
    group_by_keys:
      - UID
      - userID
      - user_id
      - sess_id
    end_span_duration: 500ms

exporters:
  debug:
    verbosity: detailed
  otlp/jaeger:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: []
      exporters: [logs_to_spans]
    traces:
      receivers: [logs_to_spans]
      exporters: [debug, otlp/jaeger]
