dist:
  name: otelcol-logs-to-spans-quickstart
  version: 0.1.0
  description: Minimal collector for the logs-to-spans quickstart
  output_path: ./otelcol-dist

connectors:
  - gomod: "github.com/agardnerIT/logs-to-spans-otel v0.8.0"
    name: "logs_to_spans"

# Build the connector from the working tree, not the published v0.7.0 tag, so
# the quickstart image contains the code in this checkout. The path is resolved
# relative to output_path (./otelcol-dist), so ../ is the repository root.
replaces:
  - github.com/agardnerIT/logs-to-spans-otel => ../

receivers:
  - gomod: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.165.1"

processors:
  # Rebase app.log's fixed dates onto now, so the spans land inside Jaeger's
  # default "Last 1 hour" view instead of years in the past.
  - gomod: "github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.165.1"

exporters:
  - gomod: "go.opentelemetry.io/collector/exporter/debugexporter v0.165.0"
  - gomod: "go.opentelemetry.io/collector/exporter/otlphttpexporter v0.165.0"

providers:
  - gomod: "go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0"
  - gomod: "go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0"
  - gomod: "go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.71.0"
