version: 2

updates:
  # Only the connector itself is a tracked Go module. The throwaway collector
  # distribution under otelcol-dist/ is generated by OCB and gitignored, so
  # pointing Dependabot at it fails every run with "No go.mod files found".
  # Its dependency versions are pinned in builder-config.yaml, which Dependabot
  # cannot update; bump those by hand with the rest of the collector.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      otel:
        patterns:
          - 'go.opentelemetry.io/*'
      all-other:
        patterns:
          - '*'

  # Actions are pinned by commit SHA in the workflows; Dependabot is what keeps
  # those pins fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The quickstart Dockerfile pins its base images by digest (see
  # examples/quickstart/Dockerfile); this keeps those digests current.
  - package-ecosystem: docker
    directory: /examples/quickstart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
