name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate-configs:
    name: Build collector and validate example configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod tracks the collector dependency line used by
          # opentelemetry-collector-contrib main, so pin the matching Go
          # toolchain. check-latest picks up patch releases.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Install OpenTelemetry Collector Builder (ocb)
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.162.0

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build the collector from builder-config.yaml
        run: $(go env GOPATH)/bin/builder --config builder-config.yaml

      - name: Validate every shipped example config
        run: |
          set -euo pipefail
          shopt -s nullglob
          for cfg in *.yaml; do
            # builder-config.yaml is OCB input, not a collector config. The
            # donation metadata files (metadata.yaml, config.schema.yaml) are
            # not collector configs either. Everything else in the repo root is
            # a shipped example and must validate.
            case "$cfg" in
              builder-config.yaml|metadata.yaml|config.schema.yaml) continue ;;
            esac
            echo "::group::validate --config $cfg"
            ./otelcol-dist/otelcol-logs-to-spans validate --config "$cfg"
            echo "::endgroup::"
          done
