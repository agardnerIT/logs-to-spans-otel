name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Cancel superseded runs: a force-push or a follow-up commit to the same PR
# makes the in-flight run obsolete, so it is stopped instead of finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository. Without this block
# the token inherits the repository default, which on older repositories is
# read/write on contents, issues and pull requests - and `go test`/`go vet` run
# unreviewed pull-request code with it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      # Pinned to the version contrib's internal/tools/go.mod uses. The same
      # command is documented in the README so local and CI runs match.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      # Reachable-symbol analysis of the module's whole dependency graph. For a
      # connector that ships inside other people's collectors, a vulnerable
      # transitive dependency is a vulnerability in every distribution that
      # includes it. Pinned like every other tool in this workflow: @latest
      # would run whatever the module proxy serves today, unreviewed.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  validate-configs:
    name: Build collector and validate example configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod tracks the collector dependency line used by
          # opentelemetry-collector-contrib main, so pin the matching Go
          # toolchain. check-latest picks up patch releases.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Install OpenTelemetry Collector Builder (ocb)
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.165.0

      # golangci-lint's govet subsumes this, but it is cheap and gives the
      # build job a fast, readable failure before the OCB build.
      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      # The allocation budgets in the test suite only catch a regression at the
      # record level. Running the benchmarks makes the per-operation numbers
      # exist in CI history instead of only on a maintainer's laptop.
      - name: Run benchmarks
        run: go test -run '^$' -bench . -benchtime 50x -benchmem ./... | tee bench.txt

      - name: Build the collector from builder-config.yaml
        run: $(go env GOPATH)/bin/builder --config builder-config.yaml

      - name: Validate every shipped example config
        run: |
          set -euo pipefail
          shopt -s nullglob
          for cfg in *.yaml examples/*/collector.yaml; do
            # builder-config.yaml is OCB input, not a collector config. The
            # donation metadata files (metadata.yaml, config.schema.yaml) are
            # not collector configs either. Everything else is a shipped
            # example and must validate.
            case "$cfg" in
              builder-config.yaml|metadata.yaml|config.schema.yaml) continue ;;
            esac
            echo "::group::validate --config $cfg"
            ./otelcol-dist/otelcol-logs-to-spans validate --config "$cfg"
            echo "::endgroup::"
          done
